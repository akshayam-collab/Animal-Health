<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PawPulse — understand changes, monitor wellbeing, and keep your pet safer.">
<title>PawPulse | Animal Wellbeing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#142b45;--blue:#416b91;--teal:#4d8984;--ink:#26384a;--muted:#6d7d8d;--line:#e2e9ef;--pale:#f3f7fa}
*{box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:#f7f9fb;color:var(--ink)}h1,h2,h3,h4,.brand{font-family:'Manrope',sans-serif}button,a,input,select,textarea{outline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4d8984;outline-offset:2px}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;z-index:30;overflow-y:auto}.main{margin-left:250px;min-height:100vh}.navlink{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:10px;color:#617184;font-size:13px;font-weight:600;transition:.2s}.navlink:hover{background:#f1f6f8;color:var(--navy)}.navlink.active{background:#eaf2f6;color:var(--navy)}.navlink svg{width:17px;height:17px;flex:none}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #203b5210}.btn{border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#24496d;transform:translateY(-1px)}.btn-secondary{background:#edf3f6;color:var(--navy);border:1px solid #dce6ec}.btn-secondary:hover{background:#e2edf1}.btn-quiet{color:var(--blue);background:transparent}.field{width:100%;border:1px solid #d9e2e9;border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);font-size:14px}.field:focus{border-color:var(--teal);outline:2px solid #4d898433}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--teal)}.page{max-width:1180px;margin:auto;padding:34px 38px 0;animation:fadeUp .28s ease}.page-title{font-size:27px;font-weight:800;color:var(--navy);letter-spacing:-.03em}.page-sub{color:var(--muted);font-size:14px;margin-top:6px}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#edf3f6;color:#46627b}.pill.green{background:#e8f3ef;color:#286b5c}.pill.amber{background:#fff4df;color:#93621b}.pill.red{background:#fceceb;color:#a24a43}.stat{font-size:25px;font-weight:800;color:var(--navy);font-family:'Manrope'}.pet-avatar{width:54px;height:54px;border-radius:15px;background:#eaf1f5;display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:18px}.placeholder{background:linear-gradient(135deg,#edf3f6,#e4edf1);border:1px dashed #afc1cd;border-radius:14px;display:grid;place-items:center;color:#61788a;text-align:center;min-height:150px;padding:18px;font-size:13px}.bar{height:8px;background:#edf1f4;border-radius:99px;overflow:hidden}.bar>span{height:100%;display:block;background:#5e9290;border-radius:99px}.timeline-line{border-left:2px solid #dce7eb;margin-left:8px;padding-left:20px}.timeline-item{position:relative;padding-bottom:22px}.timeline-item:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#5e9290;left:-26px;top:4px;border:2px solid #fff;box-shadow:0 0 0 1px #b9d0d0}.mapmock{height:300px;position:relative;overflow:hidden;border-radius:14px;background-color:#eaf1ef;background-image:linear-gradient(30deg,transparent 48%,#d5e2dc 49%,#d5e2dc 51%,transparent 52%),linear-gradient(120deg,transparent 48%,#d5e2dc 49%,#d5e2dc 51%,transparent 52%);background-size:100px 90px}.maproad{position:absolute;background:#fff;border:1px solid #dbe5df;height:15px;width:130%;transform:rotate(-22deg);top:45%;left:-10%}.maproad.two{transform:rotate(53deg);top:20%;left:10%;height:12px}.map-pin{position:absolute;left:54%;top:43%;width:19px;height:19px;border-radius:50% 50% 50% 0;background:#416b91;transform:rotate(-45deg);box-shadow:0 2px 8px #1a3b5540}.map-pin:after{content:'';position:absolute;width:7px;height:7px;background:white;border-radius:50%;top:6px;left:6px}.reveal{animation:fadeUp .45s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.ripple{position:relative;overflow:hidden}.ripple-effect{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:ripple .55s linear;pointer-events:none}@keyframes ripple{to{transform:scale(4);opacity:0}}.floating-ai{position:fixed;right:25px;bottom:24px;z-index:40;width:55px;height:55px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 8px 25px #142b4540;border:1px solid #6b9b9b;cursor:pointer}.chat-panel{position:fixed;right:25px;bottom:90px;width:min(360px,calc(100vw - 32px));height:450px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 15px 50px #142b452b;z-index:39;display:flex;flex-direction:column;overflow:hidden}.chat-messages{flex:1;overflow:auto;padding:15px}.bubble{max-width:88%;padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.5;margin-bottom:10px}.bubble.user{background:#eaf2f6;margin-left:auto;color:#17344f}.bubble.bot{background:#f3f6f8;color:#33495d}.mobile-head{display:none}.footer{border-top:1px solid var(--line);margin-top:45px;padding:23px 0 28px;color:#718092;font-size:12px}.footer a{color:#496984;text-decoration:underline;text-underline-offset:3px}.hidden-view{display:none!important}.video-thumb{min-height:125px;background:#edf3f6;border-radius:12px;display:grid;place-items:center;border:1px dashed #b7c8d2;color:#587187;font-size:12px;text-align:center;padding:14px}
@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px}.page{padding:28px 22px 0}}
@media(max-width:700px){.sidebar{display:none}.main{margin-left:0}.mobile-head{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:25;padding:12px 16px;align-items:center;justify-content:space-between}.page{padding:24px 16px 0}.page-title{font-size:23px}.mobile-nav{display:none;position:absolute;top:58px;left:0;right:0;background:white;padding:12px 16px;border-bottom:1px solid var(--line);max-height:70vh;overflow:auto}.mobile-nav.open{display:grid;grid-template-columns:1fr 1fr;gap:4px}.floating-ai{right:15px;bottom:15px}.chat-panel{right:10px;bottom:80px}.footer{margin-top:30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<aside class="sidebar" aria-label="Main navigation">
 <div class="px-5 pt-6 pb-5">
  <div class="flex items-center gap-3"><div id="logoMark" class="w-10 h-10 rounded-xl bg-[#142b45] grid place-items-center"></div><div><div class="brand font-extrabold text-[#142b45] text-lg leading-tight">PawPulse</div><div class="text-[10px] tracking-widest uppercase text-slate-400 font-bold">Pet wellbeing</div></div></div>
 </div>
 <div class="px-3 pb-6">
  <div class="px-3 text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-2">Workspace</div>
  <nav id="sideNav" class="space-y-1"></nav>
  <div class="px-3 text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-6 mb-2">Support</div>
  <nav id="supportNav" class="space-y-1"></nav>
  <div class="mx-3 mt-7 p-3 rounded-xl bg-[#f2f6f8]"><div class="text-xs font-bold text-[#142b45]">Prototype environment</div><p class="text-[11px] text-slate-500 mt-1 leading-relaxed">Sample profiles and readings are simulated. No live GPS or medical diagnosis.</p></div>
 </div>
</aside>
<div class="main">
 <header class="mobile-head"><div class="flex items-center gap-2"><div id="mobileLogo" class="w-8 h-8 rounded-lg bg-[#142b45] grid place-items-center"></div><span class="brand font-extrabold text-[#142b45]">PawPulse</span></div><button class="btn btn-secondary" id="menuToggle" aria-expanded="false" aria-controls="mobileNav">Menu</button><nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav></header>
 <main id="appView" tabindex="-1"></main>
</div>
<button class="floating-ai" id="floatingAI" aria-label="Open PawPulse AI Companion" title="Open PawPulse AI"><span id="floatLogo"></span></button>
<section class="chat-panel hidden-view" id="quickChat" aria-label="PawPulse AI quick chat">
 <div class="p-4 bg-[#142b45] text-white flex items-center justify-between"><div><div class="font-bold text-sm">PawPulse AI</div><div class="text-[10px] text-slate-300">Prototype companion</div></div><button id="closeChat" class="text-white text-xl" aria-label="Close chat">×</button></div>
 <div class="chat-messages" id="quickMessages"></div>
 <div class="p-3 border-t flex gap-2"><input id="quickInput" class="field text-xs" placeholder="Ask about your pet..." aria-label="Message PawPulse AI"><button id="quickSend" class="btn btn-primary">Send</button></div>
 <div class="px-3 pb-3"><button id="expandAI" class="text-xs text-[#416b91] underline">Open full AI Companion</button></div>
</section>
<script>
// PawPulse is a front-end prototype. Sample animal, location and wellbeing readings are simulated.
const icon=(name)=>{const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-9h.01"/>',grid:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',paw:'<circle cx="7" cy="8" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="17" cy="8" r="2"/><path d="M5 16c0-2 3-5 7-5s7 3 7 5-2 4-4 4H9c-2 0-4-2-4-4z"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/>',device:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 7h6m-6 10h6"/>',file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/>',book:'<path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4z"/><path d="M20 4h-3a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h3z"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v1"/>',chat:'<path d="M4 5h16v12H9l-5 4z"/>',source:'<path d="M4 4h16v16H4z"/><path d="M8 8h8m-8 4h8m-8 4h5"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.2.8-1.5 1.2-1.5 2.5m0 3h.01"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.6.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.6-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.6.9l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.9Z"/>',heart:'<path d="M20.8 8.8c0 5.2-8.8 10.2-8.8 10.2S3.2 14 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'};return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.grid}</svg>`};
const logo=`<svg viewBox="0 0 40 40" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="11" r="3"/><circle cx="18" cy="7" r="3"/><circle cx="27" cy="10" r="3"/><path d="M7 23c0-4 5-8 11-8s11 4 11 8-3 7-7 7H14c-4 0-7-3-7-7Z"/><path d="M2 20h7l3-4 4 8 3-5h6l3-3h7"/></svg>`;
document.querySelectorAll('#logoMark,#mobileLogo,#floatLogo').forEach((e,i)=>e.innerHTML=logo);
const navItems=[['home','Home','home'],['about','About PawPulse','info'],['dashboard','Dashboard','grid'],['pets','My Pets','paw'],['location','Live Location','pin'],['insights','Insights','activity'],['timeline','Wellness Timeline','clock'],['alerts','Alerts','bell'],['device','Device','device'],['reports','Reports','file'],['learn','PawPulse Learn','book'],['community','Community','users'],['ai','AI Companion','chat']];
const supportItems=[['evidence','Evidence & Sources','source'],['vet','Veterinary Help','help'],['settings','Settings','settings']];
const navLink=(item)=>`<a href="#${item[0]}" class="navlink" data-view="${item[0]}">${icon(item[2])}<span>${item[1]}</span></a>`;
document.getElementById('sideNav').innerHTML=navItems.map(navLink).join('');
document.getElementById('supportNav').innerHTML=supportItems.map(navLink).join('');
document.getElementById('mobileNav').innerHTML=[...navItems,...supportItems].map(navLink).join('');
const petsDefault=[{id:1,name:'Max',species:'Dog',breed:'Labrador mix',age:'4 years',baseline:78,activity:62,rest:12,appetite:'Normal',location:'Riverside walking path',status:'Connected',notes:'Enjoyed a usual morning walk.'},{id:2,name:'Luna',species:'Cat',breed:'Domestic shorthair',age:'2 years',baseline:46,activity:39,rest:15,appetite:'Normal',location:'Home · living room',status:'Connected',notes:'Usual afternoon resting pattern.'}];
let pets=JSON.parse(localStorage.getItem('ppPets')||'null')||petsDefault;
let selected=Number(localStorage.getItem('ppSelected')||1);
let mode=localStorage.getItem('ppMode')||'normal';
let alerts=JSON.parse(localStorage.getItem('ppAlerts')||'null')||[{id:1,pet:1,title:'Activity below usual pattern',time:'Today · 10:40 AM',detail:'Max recorded less activity than his personal example baseline. A single change does not explain its cause; check the wider routine and any other observations.',status:'New',type:'amber'},{id:2,pet:2,title:'Safe-zone arrival',time:'Yesterday · 6:15 PM',detail:'Luna returned to the simulated home safe zone.',status:'Reviewed',type:'green'}];
let stories=JSON.parse(localStorage.getItem('ppStories')||'null')||[{id:1,animal:'Dog',title:'Learning to notice a quieter morning',user:'Anonymous pet parent',tags:['Routine','Activity'],story:'Our dog was usually ready at the door early in the morning. For a few days he was slower to get moving. We wrote down what we noticed and called our veterinary clinic for advice. Keeping a simple record helped us explain the change clearly.'},{id:2,animal:'Cat',title:'A small change in Luna’s routine',user:'Anonymous pet parent',tags:['Cat care','Appetite'],story:'My cat left some breakfast in her bowl, which was unusual for her. I checked whether anything else in her routine had changed and made a note of it. I contacted our vet when the change continued.'}];
let messages=JSON.parse(localStorage.getItem('ppMessages')||'[]');
let settings=JSON.parse(localStorage.getItem('ppSettings')||'{}');
let currentView='home',previousView='learn',activeTutorial=null;
const save=()=>{localStorage.setItem('ppPets',JSON.stringify(pets));localStorage.setItem('ppSelected',selected);localStorage.setItem('ppMode',mode);localStorage.setItem('ppAlerts',JSON.stringify(alerts));localStorage.setItem('ppStories',JSON.stringify(stories));localStorage.setItem('ppMessages',JSON.stringify(messages));localStorage.setItem('ppSettings',JSON.stringify(settings))};
const pet=()=>pets.find(p=>p.id===selected)||pets[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const footer=()=>`<footer class="footer"><div class="flex flex-col md:flex-row gap-4 justify-between"><div><div class="font-bold text-[#142b45] mb-1">© 2026 PawPulse. All rights reserved.</div><p class="max-w-xl leading-relaxed">PawPulse is a prototype decision-support concept. It does not replace professional veterinary advice, diagnosis or assessment. Demo readings and device functions are simulated.</p></div><div class="flex flex-wrap gap-x-5 gap-y-2 self-start"><a href="#about">About PawPulse</a><a href="#privacy">Privacy Policy</a><a href="#terms">Terms of Use</a><a href="#contact">Contact Us</a></div></div></footer>`;
const shell=(eyebrow,title,sub,body)=>`<section class="page"><div class="mb-7"><div class="eyebrow">${eyebrow}</div><h1 class="page-title mt-2">${title}</h1><p class="page-sub">${sub}</p></div>${body}${footer()}</section>`;
const petSelect=()=>`<select class="field max-w-[220px]" aria-label="Select pet" onchange="selectPet(this.value)">${pets.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} · ${p.species}</option>`).join('')}</select>`;
const card=(content,extra='')=>`<div class="card p-5 ${extra}">${content}</div>`;
const btn=(label,action,kind='primary')=>`<button class="btn btn-${kind} ripple" onclick="${action}">${label}</button>`;
const petSummary=(p)=>`<div class="flex items-center gap-3"><div class="pet-avatar">${p.species==='Dog'?'M':'L'}</div><div><div class="font-bold text-[#142b45]">${esc(p.name)}</div><div class="text-xs muted">${esc(p.species)} · ${esc(p.breed)} · ${esc(p.age)}</div></div></div>`;
const alertCount=()=>alerts.filter(a=>a.status==='New').length;
function navigate(view){if(view==='privacy'||view==='terms'||view==='contact'){currentView=view}else currentView=view; if(view!=='tutorial')location.hash=view; render();document.getElementById('appView').focus({preventScroll:true});}
function selectPet(id){selected=Number(id);save();render()}
function setMode(m){mode=m;if(m==='concern'){pets=pets.map(p=>p.id===1?{...p,activity:28,rest:16,appetite:'Less than usual',notes:'Caregiver noted a quieter morning and reduced interest in breakfast.'}:p);if(!alerts.some(a=>a.title==='Significant change from usual pattern'&&a.pet===1))alerts.unshift({id:Date.now(),pet:1,title:'Significant change from usual pattern',time:'Just now · Demo scenario',detail:'The demo scenario combines lower activity, a longer rest period and an appetite observation compared with Max’s example baseline. This is not a diagnosis. Review the context and contact a veterinarian if you are concerned.',status:'New',type:'amber'})}else{pets=pets.map(p=>p.id===1?{...p,activity:62,rest:12,appetite:'Normal',notes:'Enjoyed a usual morning walk.'}:p);alerts=alerts.filter(a=>a.title!=='Significant change from usual pattern')}save();render()}
function render(){
 document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('active',a.dataset.view===currentView));
 const p=pet();let out='';
 if(currentView==='home')out=homeView();
 else if(currentView==='about')out=aboutView();
 else if(currentView==='dashboard')out=dashboardView();
 else if(currentView==='pets')out=petsView();
 else if(currentView==='location')out=locationView();
 else if(currentView==='insights')out=insightsView();
 else if(currentView==='timeline')out=timelineView();
 else if(currentView==='alerts')out=alertsView();
 else if(currentView==='device')out=deviceView();
 else if(currentView==='reports')out=reportsView();
 else if(currentView==='learn')out=learnView();
 else if(currentView==='tutorial')out=tutorialView();
 else if(currentView==='community')out=communityView();
 else if(currentView==='ai')out=aiView();
 else if(currentView==='evidence')out=evidenceView();
 else if(currentView==='vet')out=vetView();
 else if(currentView==='settings')out=settingsView();
 else out=legalView(currentView);
 document.getElementById('appView').innerHTML=out;
 document.getElementById('appView').querySelectorAll('.reveal').forEach((el,i)=>{el.style.animationDelay=(Math.min(i,8)*45)+'ms'});
}
function homeView(){return `<section class="page"><div class="rounded-3xl bg-[#142b45] text-white p-7 md:p-11 overflow-hidden relative"><div class="max-w-2xl relative z-10"><div class="text-xs uppercase tracking-[.2em] text-[#a9c8c8] font-bold">A clearer picture of everyday wellbeing</div><h1 class="brand text-3xl md:text-4xl font-extrabold leading-tight mt-4">Understand changes.<br>Monitor wellbeing.<br>Keep your pet safer.</h1><p class="text-slate-300 mt-5 leading-relaxed max-w-xl">PawPulse helps dog and cat owners notice patterns in location, activity, rest and everyday observations — so small changes are easier to discuss with a veterinary professional.</p><div class="flex flex-wrap gap-3 mt-7">${btn('Explore Dashboard',"navigate('dashboard')")}${btn('Learn About PawPulse',"navigate('about')",'secondary')}</div></div><div class="absolute right-[-20px] bottom-[-40px] opacity-10 scale-[5]">${logo}</div></div>
 <div class="grid md:grid-cols-3 gap-4 mt-6">${[['Location monitoring','Understand where your pet has been in the simulated demo.','location','pin'],['Personal patterns','Compare activity and rest with an individual example baseline.','insights','activity'],['Care knowledge','Explore practical dog and cat wellbeing information.','learn','book']].map(x=>`<button class="card p-5 text-left hover:-translate-y-1 transition reveal" onclick="navigate('${x[2]}')"><div class="text-[#4d8984] mb-3">${icon(x[3])}</div><div class="font-bold text-[#142b45]">${x[0]}</div><p class="text-sm muted mt-2">${x[1]}</p><div class="text-xs text-[#416b91] font-bold mt-4">Explore section →</div></button>`).join('')}</div>
 <div class="grid md:grid-cols-2 gap-4 mt-4">${card(`<div class="eyebrow">Your demo space</div><div class="flex justify-between items-center mt-2"><div class="text-xl font-bold text-[#142b45]">Pet overview</div>${petSelect()}</div><div class="mt-5">${pets.map(x=>`<div class="flex justify-between items-center py-3 border-b last:border-0" ><div>${petSummary(x)}</div><span class="pill green">Connected · demo</span></div>`).join('')}</div>`)}${card(`<div class="eyebrow">Try the demonstration</div><h2 class="text-lg font-bold text-[#142b45] mt-2">Explore a sample day</h2><p class="text-sm muted mt-2">Switch between a typical example day and a simulated change in Max’s routine. No real health data is collected.</p><div class="flex gap-2 mt-5 flex-wrap">${btn('Normal example day',"setMode('normal')",'secondary')}${btn('Simulate a concern',"setMode('concern')")}</div><div class="mt-4 text-xs muted">Current mode: <strong>${mode==='normal'?'Normal example day':'Simulated concern'}</strong></div>`)}</div>${footer()}</section>`}
function aboutView(){return shell('About PawPulse','A little more context. A better conversation.','PawPulse brings everyday observations together to help owners recognise changes in their pet’s routine.',`<div class="grid md:grid-cols-2 gap-5">${card(`<h2 class="font-bold text-lg text-[#142b45]">The problem</h2><p class="text-sm muted leading-relaxed mt-3">Dogs and cats cannot describe how they feel. Changes in movement, rest, appetite or familiar routines can be easy to miss when observations are scattered across the day.</p>`)}${card(`<h2 class="font-bold text-lg text-[#142b45]">How it works</h2><p class="text-sm muted leading-relaxed mt-3">PawPulse organises location context, activity patterns and caregiver notes. It compares sample readings with an individual baseline and explains why a change may be worth checking.</p>`)}</div><div class="grid md:grid-cols-3 gap-4 mt-5">${['Location monitoring','Individual behaviour baselines','Activity and rest tracking','Wellness observations','AI-supported explanations','Learning and veterinary preparation'].map(t=>card(`<div class="font-bold text-[#142b45]">${t}</div><p class="text-sm muted mt-2">A connected part of a pet’s everyday wellbeing record.</p>`)).join('')}</div><div class="card p-5 mt-5"><div class="eyebrow">Who it is for</div><p class="text-sm leading-relaxed mt-2">Dog and cat owners, family caregivers and pet sitters who want a clearer shared record of routines and observations. PawPulse is different from a basic GPS tracker because it focuses on changes from an individual pattern, not location alone.</p><p class="text-sm mt-3 font-semibold text-[#93621b]">Prototype note: readings, maps, AI responses and wearable functions in this version are simulated. PawPulse does not diagnose illness or replace veterinary care.</p></div>`)}
function dashboardView(){let p=pet();return shell('Overview','Good to see you.','A snapshot of '+esc(p.name)+'’s example wellbeing information.',`<div class="flex flex-wrap items-center justify-between gap-3 mb-5">${petSelect()}<div class="flex gap-2">${btn('Normal day',"setMode('normal')",'secondary')}${btn('Simulate concern',"setMode('concern')")}</div></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${[['Activity',p.activity+'%', 'of example daily pattern'],['Rest',p.rest+' hrs','recorded in demo'],['Appetite',p.appetite,'caregiver observation'],['Device',p.status,'simulated connection']].map(s=>card(`<div class="text-xs muted">${s[0]}</div><div class="stat mt-2 text-2xl">${esc(s[1])}</div><div class="text-xs muted mt-1">${s[2]}</div>`)).join('')}</div><div class="grid lg:grid-cols-5 gap-4 mt-5"><div class="lg:col-span-3">${card(`<div class="flex justify-between items-start"><div><div class="eyebrow">Selected pet</div><div class="mt-3">${petSummary(p)}</div></div><span class="pill green">Demo connected</span></div><div class="grid grid-cols-2 gap-4 mt-6"><div><div class="text-xs muted mb-2">Activity vs example baseline</div><div class="bar"><span style="width:${p.activity}%"></span></div><div class="text-xs mt-2 font-bold">${p.activity}% of usual example</div></div><div><div class="text-xs muted mb-2">Rest observation</div><div class="bar"><span style="width:${Math.min(100,p.rest/18*100)}%"></span></div><div class="text-xs mt-2 font-bold">${p.rest} hours</div></div></div><div class="mt-5 p-3 rounded-xl bg-[#f5f8fa] text-sm"><strong>Recent note:</strong> ${esc(p.notes)}</div><div class="flex flex-wrap gap-2 mt-4">${btn('Open pet profile',"navigate('pets')",'secondary')}${btn('View insights',"navigate('insights')",'secondary')}</div>`)}</div><div class="lg:col-span-2">${card(`<div class="flex justify-between"><h2 class="font-bold text-[#142b45]">Recent alerts</h2><span class="pill ${alertCount()?'amber':'green'}">${alertCount()} new</span></div>${alerts.slice(0,3).map(a=>`<button onclick="navigate('alerts')" class="block text-left w-full py-3 border-b last:border-0"><div class="text-sm font-semibold">${esc(a.title)}</div><div class="text-xs muted mt-1">${esc(a.time)} · ${a.status}</div></button>`).join('')||'<p class="text-sm muted mt-4">No alerts in this demo.</p>'}<button class="text-xs text-[#416b91] font-bold mt-3" onclick="navigate('alerts')">View all alerts →</button>`)}</div></div>${footer()}`)}
function petsView(){return shell('Pet profiles','The animals at the centre of it all.','Select a profile to keep the demo dashboard, insights and reports in sync.',`<div class="grid md:grid-cols-2 gap-4">${pets.map(p=>card(`<div class="flex items-start justify-between"><div>${petSummary(p)}</div>${selected===p.id?'<span class="pill green">Selected</span>':`<button class="btn btn-secondary" onclick="selectPet(${p.id})">Select pet</button>`}</div><div class="grid grid-cols-2 gap-3 mt-5 text-sm"><div><div class="text-xs muted">Usual activity</div><strong>${p.baseline}% example baseline</strong></div><div><div class="text-xs muted">Typical rest</div><strong>${p.species==='Dog'?'12':'15'} hours / demo</strong></div><div><div class="text-xs muted">Appetite</div><strong>${esc(p.appetite)}</strong></div><div><div class="text-xs muted">Monitoring</div><strong>${esc(p.status)}</strong></div></div><p class="text-xs muted mt-4">Recent observation: ${esc(p.notes)}</p><button class="text-xs text-[#416b91] underline mt-3" onclick="editPet(${p.id})">Edit basic details</button>`)).join('')}</div><div class="card p-5 mt-5"><h2 class="font-bold text-[#142b45]">Add a demo pet</h2><p class="text-xs muted mt-1">Create a local sample profile. Do not enter sensitive personal information.</p><form class="grid md:grid-cols-4 gap-3 mt-4" onsubmit="addPet(event)"><label class="text-xs font-semibold">Pet name<input required maxlength="24" class="field mt-1" name="name"></label><label class="text-xs font-semibold">Species<select class="field mt-1" name="species"><option>Dog</option><option>Cat</option></select></label><label class="text-xs font-semibold">Age<input class="field mt-1" name="age" placeholder="e.g. 3 years"></label><div class="flex items-end"><button class="btn btn-primary w-full">Add pet</button></div></form></div>${footer()}`)}
function editPet(id){let p=pets.find(x=>x.id===id);let name=prompt('Update pet name:',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,24);save();render()}}
function addPet(e){e.preventDefault();let f=new FormData(e.target);let x={id:Date.now(),name:f.get('name').trim(),species:f.get('species'),breed:'Not specified',age:f.get('age')||'Not specified',baseline:f.get('species')==='Dog'?70:45,activity:50,rest:12,appetite:'Not recorded',location:'Home · simulated',status:'Demo profile',notes:'No observations added yet.'};pets.push(x);selected=x.id;save();render()}
function locationView(){let p=pet();return shell('Live location','Location context, not live tracking.','This illustrative map and route history are simulated and do not represent actual GPS data.',`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 card p-3"><div class="mapmock" role="img" aria-label="Illustrative simulated map with a location marker"><div class="maproad"></div><div class="maproad two"></div><div class="absolute top-4 left-4 bg-white rounded-lg px-3 py-2 text-xs shadow">Demo map · ${esc(p.name)}</div><div class="map-pin" title="Simulated location"></div><div class="absolute bottom-4 right-4 bg-white rounded-lg px-3 py-2 text-xs shadow">Home safe zone</div></div><div class="flex justify-between items-center px-2 pt-3"><div><div class="text-xs muted">Current simulated location</div><div class="font-bold text-[#142b45] mt-1">${esc(p.location)}</div></div><span class="pill green">Device ${esc(p.status)}</span></div></div><div class="card p-5"><div class="eyebrow">Location history</div><div class="timeline-line mt-5">${[['10:30 AM','Arrived at walking area'],['9:50 AM','Left home safe zone'],['8:15 AM','At home · resting']].map(a=>`<div class="timeline-item"><div class="text-xs font-bold">${a[0]}</div><div class="text-sm muted mt-1">${a[1]}</div></div>`).join('')}</div><div class="mt-3 p-3 rounded-lg bg-[#f5f8fa] text-xs muted">Safe zones are conceptual demo boundaries. No alerts are generated from real movement.</div></div></div><div class="mt-4">${petSelect()}</div>${footer()}`)}
function insightsView(){let p=pet(),concern=mode==='concern'&&p.id===1;return shell('Pattern review','Insights for '+esc(p.name),'Example pattern comparisons are prompts for observation, not medical conclusions.',`<div class="flex justify-between items-center flex-wrap gap-3 mb-4">${petSelect()}<span class="pill ${concern?'amber':'green'}">${concern?'Potential concern detected':'No significant demo change'}</span></div><div class="grid md:grid-cols-2 gap-4">${card(`<div class="eyebrow">Activity pattern</div><div class="flex items-end gap-3 mt-3"><div class="stat">${p.activity}%</div><div class="text-xs muted mb-1">of individual example baseline</div></div><div class="bar mt-3"><span style="width:${p.activity}%"></span></div><p class="text-sm muted mt-3">${concern?'Activity is lower than Max’s example usual pattern.':'Activity is within this demo’s typical example range.'}</p>`)}${card(`<div class="eyebrow">Rest and appetite</div><div class="mt-3 text-sm"><div class="flex justify-between py-2 border-b"><span>Rest observation</span><strong>${p.rest} hours</strong></div><div class="flex justify-between py-2"><span>Appetite note</span><strong>${esc(p.appetite)}</strong></div></div>`)}</div>${card(`<h2 class="font-bold text-[#142b45]">Why was this flagged?</h2><p class="text-sm muted leading-relaxed mt-2">${concern?'The simulated concern combines activity below the example baseline, a longer rest period and a caregiver note about reduced breakfast interest. These observations are not specific to one condition and cannot identify a cause. Consider the full context and contact a veterinarian if the change persists or you are worried.':'In this normal demo state, the selected pet’s sample readings do not show the combined change used in the concern scenario. Individual routines vary; the baseline is illustrative.'}</p><div class="mt-4 flex flex-wrap gap-2">${btn('Open wellness timeline',"navigate('timeline')",'secondary')}${btn('Prepare vet notes',"navigate('vet')",'secondary')}</div>`,'mt-4')}<p class="text-xs muted mt-4">PawPulse does not diagnose, predict or rule out illness. AI explanations are generated from the sample information shown in this prototype.</p>${footer()}`)}
function timelineView(){let p=pet();return shell('Wellness timeline','A record of everyday patterns.','Explore the simulated activity, rest and caregiver observations for the selected pet.',`<div class="flex flex-wrap gap-3 mb-5">${petSelect()}<select class="field max-w-[180px]" id="rangeSelect" aria-label="Date range" onchange="document.getElementById('rangeNote').textContent='Showing '+this.value.toLowerCase()+' of sample entries.'"><option>7 days</option><option>30 days</option><option>Today</option></select></div><div class="grid md:grid-cols-3 gap-4">${[['Activity',p.activity+'%','Example daily activity'],['Rest',p.rest+' h','Sample rest observation'],['Appetite',p.appetite,'Caregiver-entered note']].map(x=>card(`<div class="text-xs muted">${x[0]}</div><div class="stat mt-2">${esc(x[1])}</div><div class="text-xs muted mt-1">${x[2]}</div>`)).join('')}</div><div class="card p-5 mt-5"><div class="flex justify-between"><h2 class="font-bold text-[#142b45]">Recent entries</h2><span class="pill">Simulated</span></div><div id="rangeNote" class="text-xs muted mt-1">Showing 7 days of sample entries.</div><div class="timeline-line mt-6">${[['Today · 10:40 AM','Activity','Activity below the example baseline.'],['Today · 8:15 AM','Caregiver note',p.notes],['Yesterday · 7:00 PM','Rest','Usual evening rest period recorded in this demo.'],['Yesterday · 8:00 AM','Appetite',p.appetite+' appetite observation.']].map((x,i)=>`<div class="timeline-item"><div class="flex gap-2 items-center"><strong class="text-sm">${x[1]}</strong><span class="text-xs muted">${x[0]}</span></div><p class="text-sm muted mt-1">${esc(x[2])}</p></div>`).join('')}</div></div>${footer()}`)}
function alertsView(){return shell('Alert centre','Changes worth a closer look.','Every item below is a simulated event. Review the context before deciding what to do.',`<div class="flex justify-between items-center mb-4"><span class="pill amber">${alertCount()} new alerts</span>${btn('Mark all reviewed',"reviewAll()",'secondary')}</div><div class="space-y-3">${alerts.map(a=>card(`<div class="flex justify-between items-start gap-3"><div><span class="pill ${a.type==='green'?'green':'amber'}">${a.status}</span><h2 class="font-bold text-[#142b45] mt-2">${esc(a.title)}</h2><div class="text-xs muted mt-1">${esc(pets.find(p=>p.id===a.pet)?.name||'Pet')} · ${esc(a.time)}</div><p class="text-sm muted mt-3 leading-relaxed">${esc(a.detail)}</p></div><button class="btn btn-secondary text-xs" onclick="toggleAlert(${a.id})">${a.status==='New'?'Mark reviewed':a.status==='Reviewed'?'Resolve':'Reopen'}</button></div>`)).join('')||card('<p class="text-sm muted">No alerts in the demo right now.</p>')}</div>${footer()}`)}
function toggleAlert(id){let a=alerts.find(x=>x.id===id);if(a){a.status=a.status==='New'?'Reviewed':a.status==='Reviewed'?'Resolved':'New';save();render()}}
function reviewAll(){alerts.forEach(a=>{if(a.status==='New')a.status='Reviewed'});save();render()}
function deviceView(){let p=pet();return shell('Wearable concept','A lightweight idea for everyday monitoring.','A conceptual adjustable wearable for dogs and cats. Hardware has not been developed.',`<div class="grid lg:grid-cols-2 gap-5"><div class="card p-4"><div class="placeholder min-h-[290px]"><div><div class="w-20 h-20 mx-auto rounded-2xl bg-white grid place-items-center shadow-sm text-[#416b91]">${icon('device')}</div><div class="font-bold text-[#142b45] mt-4">Add PawPulse wearable image here</div><div class="text-xs mt-1">Product concept image placeholder</div></div></div></div><div class="card p-5"><div class="flex justify-between"><h2 class="font-bold text-[#142b45]">${esc(p.name)}’s device</h2><span class="pill green">${esc(p.status)}</span></div><div class="mt-5"><div class="flex justify-between text-sm"><span>Simulated battery</span><strong>82%</strong></div><div class="bar mt-2"><span style="width:82%"></span></div></div><div class="grid grid-cols-2 gap-3 mt-5">${[['Activity sensor','Sample reading'],['Movement','Simulated'],['Rest estimate','Illustrative'],['Location','Not real GPS']].map(x=>`<div class="p-3 rounded-xl bg-[#f4f7f9]"><div class="text-xs muted">${x[0]}</div><div class="font-bold text-sm text-[#142b45] mt-1">${x[1]}</div></div>`).join('')}</div><p class="text-sm muted leading-relaxed mt-5">The intended concept is lightweight, adjustable and comfortable for different dog and cat sizes. Any actual device design would need veterinary, animal-welfare and engineering testing.</p></div></div>${footer()}`)}
function reportsView(){let p=pet();return shell('Reports','A clearer summary to share with your vet.','Review the sample information and print or save it using your browser.',`<div class="card p-6" id="printReport"><div class="flex flex-wrap justify-between gap-3"><div><div class="eyebrow">PawPulse wellbeing summary</div><h2 class="text-xl font-extrabold text-[#142b45] mt-2">${esc(p.name)} · ${esc(p.species)}</h2><p class="text-xs muted mt-1">${esc(p.breed)} · ${esc(p.age)} · Generated from demo data</p></div><span class="pill amber">Prototype report</span></div><div class="grid sm:grid-cols-3 gap-4 mt-6">${[['Activity',p.activity+'%'],['Rest',p.rest+' hours'],['Appetite',p.appetite]].map(x=>`<div class="p-3 bg-[#f4f7f9] rounded-xl"><div class="text-xs muted">${x[0]}</div><div class="font-bold text-[#142b45] mt-1">${esc(x[1])}</div></div>`).join('')}</div><h3 class="font-bold text-[#142b45] mt-6">Recent observation</h3><p class="text-sm muted mt-2">${esc(p.notes)}</p><h3 class="font-bold text-[#142b45] mt-5">Recent alerts</h3><ul class="list-disc pl-5 text-sm muted mt-2">${alerts.filter(a=>a.pet===p.id).map(a=>`<li>${esc(a.title)} — ${esc(a.status)}</li>`).join('')||'<li>No alerts in this demo.</li>'}</ul><p class="text-xs muted mt-6">This report contains simulated readings and owner-entered demo notes. It is not a medical record or diagnosis.</p></div><div class="flex flex-wrap gap-2 mt-4">${btn('Print / Save as PDF',"window.print()")}${btn('Share with Veterinarian',"shareReport()",'secondary')}</div>${footer()}`)}
function shareReport(){alert('Demo action: your sample report is ready to discuss with a veterinarian. No information has been sent.')}
const tutorials=[['dogtemp',"How to Take Your Dog’s Temperature",'Dog Care','Understand the purpose of temperature checks and why a veterinarian should guide you on the right method.'],['cattemp',"How to Take Your Cat’s Temperature",'Cat Care','Learn what to discuss with a veterinary professional before attempting a temperature check.'],['dogdistress','Recognising Signs of Distress in Dogs','Basic Health Monitoring','Notice changes in posture, movement, breathing, vocalisation and normal behaviour.'],['catdistress','Recognising Signs of Distress in Cats','Basic Health Monitoring','Learn why subtle changes in hiding, movement, grooming or appetite can matter.'],['firstaid','Basic Pet First Aid Awareness','First Aid Awareness','Prepare a basic first-aid plan and understand the limits of home care.'],['emergency','Understanding When Your Pet Needs Emergency Care','Emergency Information','Recognise when urgent veterinary advice or emergency assessment is needed.']];
function learnView(){return shell('PawPulse Learn','Knowledge for everyday care.','Educational starting points for dog and cat caregivers. For concerns, contact a veterinary professional.',`<div class="grid md:grid-cols-3 gap-4 mb-6">${[['Everyday Care','Routines, observation and practical preparation'],['Basic Health Monitoring','Notice changes without trying to diagnose'],['First Aid Awareness','Understand safe preparation and professional help'],['Emergency Information','Know when urgent veterinary care may be needed'],['Dog Care','Care topics for canine companions'],['Cat Care','Care topics for feline companions']].map(x=>card(`<div class="font-bold text-[#142b45]">${x[0]}</div><p class="text-xs muted mt-2">${x[1]}</p>`)).join('')}</div><div class="flex justify-between items-end gap-3 mb-4"><div><div class="eyebrow">Tutorial library</div><h2 class="text-lg font-bold text-[#142b45] mt-1">Explore a topic</h2></div><span class="pill">Video placeholders</span></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${tutorials.map(t=>card(`<div class="video-thumb"><div><div class="mx-auto w-9 h-9 rounded-full border border-[#9db3c1] grid place-items-center mb-2">${icon('book')}</div><strong>Add video thumbnail here</strong></div></div><div class="text-[10px] uppercase tracking-widest text-[#4d8984] font-bold mt-4">${t[2]}</div><h3 class="font-bold text-[#142b45] mt-1">${t[1]}</h3><p class="text-xs muted mt-2 leading-relaxed">${t[3]}</p><button class="btn btn-secondary w-full mt-4" onclick="openTutorial('${t[0]}')">View Tutorial</button>`)).join('')}</div>${footer()}`)}
function openTutorial(id){previousView='learn';activeTutorial=id;currentView='tutorial';render()}
function tutorialView(){let t=tutorials.find(x=>x[0]===activeTutorial)||tutorials[0];return shell('PawPulse Learn · Tutorial',t[1],'An educational overview. This placeholder does not contain a playable video.',`<button class="btn btn-secondary mb-4" onclick="navigate('learn')">← Back to PawPulse Learn</button><div class="grid lg:grid-cols-5 gap-5"><div class="lg:col-span-3"><div class="placeholder min-h-[300px]"><div><div class="text-3xl mb-3">${icon('book')}</div><strong>Add video file or embed video here</strong><p class="text-xs mt-2">No video has been added yet.</p></div></div></div><div class="lg:col-span-2 card p-5"><div class="eyebrow">${t[2]}</div><h2 class="font-bold text-[#142b45] text-lg mt-2">${t[1]}</h2><p class="text-sm muted mt-3 leading-relaxed">${t[3]}</p><h3 class="font-bold text-sm text-[#142b45] mt-5">What you will learn</h3><ul class="list-disc pl-5 text-sm muted mt-2 space-y-2"><li>Which changes are useful to observe and record.</li><li>How to describe your observations clearly.</li><li>When to pause and ask a veterinary professional for guidance.</li></ul><div class="p-3 bg-[#fff6e7] rounded-xl text-xs text-[#815d28] mt-5">Safety note: do not attempt a procedure if you are unsure or your pet is distressed. Seek professional guidance. First-aid education is not a substitute for hands-on training or emergency veterinary care.</div></div></div>${footer()}`)}
function communityView(){return shell('Community','Shared experiences, in the owner’s own words.','Browse anonymous sample stories. Personal experiences are not scientific or veterinary evidence.',`<div class="card p-4 mb-4"><div class="grid md:grid-cols-3 gap-3"><input class="field" id="storySearch" placeholder="Search stories..." aria-label="Search stories" oninput="filterStories()"><select class="field" id="storyAnimal" aria-label="Filter by animal" onchange="filterStories()"><option value="All">All animals</option><option>Dog</option><option>Cat</option></select><select class="field" id="storyTopic" aria-label="Filter by topic" onchange="filterStories()"><option value="All">All topics</option><option>Routine</option><option>Activity</option><option>Cat care</option><option>Appetite</option></select></div></div><div id="storyList" class="space-y-3">${storyCards()}</div><div class="card p-5 mt-5"><h2 class="font-bold text-[#142b45]">Share your story anonymously</h2><p class="text-xs muted mt-1">No real name or phone number is requested. Your story stays in this browser prototype.</p><form class="grid md:grid-cols-2 gap-3 mt-4" onsubmit="addStory(event)"><label class="text-xs font-semibold">Story title<input class="field mt-1" name="title" required maxlength="90"></label><label class="text-xs font-semibold">Animal type<select class="field mt-1" name="animal"><option>Dog</option><option>Cat</option></select></label><label class="text-xs font-semibold md:col-span-2">What happened?<textarea class="field mt-1" rows="2" name="story" required></textarea></label><label class="text-xs font-semibold">What did you notice?<textarea class="field mt-1" rows="2" name="noticed"></textarea></label><label class="text-xs font-semibold">What did you do?<textarea class="field mt-1" rows="2" name="did"></textarea></label><label class="text-xs font-semibold">What happened afterward?<textarea class="field mt-1" rows="2" name="after"></textarea></label><label class="text-xs font-semibold">What did you learn?<textarea class="field mt-1" rows="2" name="learned"></textarea></label><div class="md:col-span-2"><button class="btn btn-primary">Share story</button></div></form></div>${footer()}`)}
function storyCards(){return stories.map(s=>`<article class="card p-5 story-card" data-animal="${s.animal}" data-tags="${s.tags.join(' ')}" data-search="${esc((s.title+' '+s.story+' '+s.tags.join(' ')).toLowerCase())}"><div class="flex justify-between gap-3"><div><span class="pill">${s.animal}</span><h3 class="font-bold text-[#142b45] mt-2">${esc(s.title)}</h3><div class="text-xs muted mt-1">${esc(s.user)}</div></div><button class="btn btn-secondary text-xs" onclick="viewStory(${s.id})">Read story</button></div><div class="flex gap-2 mt-3">${s.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><p class="text-sm muted mt-3">${esc(s.story.slice(0,150))}${s.story.length>150?'…':''}</p></article>`).join('')}
function filterStories(){let q=document.getElementById('storySearch').value.toLowerCase(),a=document.getElementById('storyAnimal').value,t=document.getElementById('storyTopic').value;document.querySelectorAll('.story-card').forEach(el=>el.classList.toggle('hidden-view',!(el.dataset.search.includes(q)&&(a==='All'||el.dataset.animal===a)&&(t==='All'||el.dataset.tags.includes(t)))))}
function addStory(e){e.preventDefault();let f=new FormData(e.target),parts=[f.get('story'),f.get('noticed')?'What I noticed: '+f.get('noticed'):'',f.get('did')?'What I did: '+f.get('did'):'',f.get('after')?'Afterward: '+f.get('after'):'',f.get('learned')?'What I learned: '+f.get('learned'):''].filter(Boolean);stories.unshift({id:Date.now(),animal:f.get('animal'),title:f.get('title'),user:'Anonymous pet parent',tags:['Community story'],story:parts.join('\\n\\n')});save();render()}
function viewStory(id){let s=stories.find(x=>x.id===id);if(!s)return;document.getElementById('storyList').innerHTML=`<div class="card p-6"><button class="btn btn-secondary mb-4" onclick="render()">← Back to stories</button><span class="pill">${s.animal}</span><h2 class="text-xl font-bold text-[#142b45] mt-3">${esc(s.title)}</h2><div class="text-xs muted mt-1">${esc(s.user)}</div><p class="text-sm leading-relaxed whitespace-pre-line mt-5">${esc(s.story)}</p><div class="text-xs muted mt-5">Personal experience shared in the PawPulse prototype. Not veterinary advice or scientific evidence.</div></div>`}
function aiAnswer(q){let p=pet(),s=q.toLowerCase();if(s.includes('flag')||s.includes('concern'))return `${p.name}’s demo profile shows ${p.activity}% of the example activity baseline, ${p.rest} hours of rest and this appetite note: “${p.appetite}”. ${mode==='concern'&&p.id===1?'The concern scenario combines several changes from the sample baseline.':'The normal example mode does not show the simulated combined concern.'} These observations do not identify a cause or diagnose a condition. If you are worried, contact your veterinarian.`;if(s.includes('story')||s.includes('community'))return `Community contains ${stories.length} anonymous sample/personal stories. You can filter them by dog, cat or topic. They are individual experiences, not verified medical evidence.`;if(s.includes('distress')||s.includes('cat'))return `For cats, pay attention to changes from their own usual behaviour, such as hiding more, reduced interaction, changes in eating or drinking, altered grooming, or unusual movement or vocalisation. These signs can have different causes. Contact a veterinarian for advice, especially if the change is sudden, severe or persistent.`;if(s.includes('source')||s.includes('evidence'))return `The Evidence & Sources section links to veterinary and animal-welfare organisations. PawPulse demo readings and AI explanations are separate from published evidence.`;return `I can help organise the information available in PawPulse. For ${p.name}, the current sample notes are: ${p.notes} I can explain the demo baseline, timeline, alerts or learning topics, but I cannot diagnose or replace a veterinarian.`}
function sendMessage(inputId,containerId){let el=document.getElementById(inputId),q=el.value.trim();if(!q)return;messages.push({role:'user',text:q},{role:'bot',text:aiAnswer(q)});save();el.value='';if(containerId==='quickMessages')renderQuick();else renderAIChat()}
function renderQuick(){document.getElementById('quickMessages').innerHTML=messages.slice(-8).map(m=>`<div class="bubble ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('');document.getElementById('quickMessages').scrollTop=99999}
function renderAIChat(){let el=document.getElementById('aiTranscript');if(el)el.innerHTML=messages.map(m=>`<div class="bubble ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')||'<div class="text-sm muted">Ask about a PawPulse feature, a sample observation or a learning topic.</div>';if(el)el.scrollTop=99999}
function aiView(){return shell('PawPulse AI','A companion for understanding the information.','Responses use the selected pet’s demo profile and the information available in this prototype.',`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 card flex flex-col min-h-[490px]"><div class="p-4 border-b flex justify-between"><div><h2 class="font-bold text-[#142b45]">Conversation</h2><p class="text-xs muted">Selected pet: ${esc(pet().name)}</p></div><button class="text-xs text-[#416b91] underline" onclick="clearChat()">Clear history</button></div><div id="aiTranscript" class="chat-messages min-h-[300px]"></div><div class="p-3 border-t"><div class="flex gap-2"><input id="aiInput" class="field" placeholder="Ask PawPulse..." aria-label="Ask PawPulse"><button class="btn btn-primary" onclick="sendMessage('aiInput','aiTranscript')">Send</button></div><div class="flex flex-wrap gap-2 mt-3"><button class="btn btn-secondary text-xs" onclick="askExample('Why was my pet flagged?')">Why was my pet flagged?</button><button class="btn btn-secondary text-xs" onclick="askExample('Show me stories about dogs with reduced activity')">Stories about reduced activity</button><button class="btn btn-secondary text-xs" onclick="askExample('How can I recognise signs of distress in cats?')">Signs of distress in cats</button></div><div class="flex gap-2 mt-3"><button class="btn btn-secondary text-xs" onclick="voiceDemo()">Use microphone · simulated</button><button class="btn btn-secondary text-xs" onclick="readLast()">Read last response</button></div><div id="voiceStatus" class="text-xs muted mt-2" aria-live="polite"></div></div></div><div class="card p-5"><div class="eyebrow">What the companion can use</div><ul class="text-sm muted mt-3 space-y-3"><li>• Selected pet profile and sample baseline</li><li>• Simulated activity, rest and appetite notes</li><li>• PawPulse timeline and alerts</li><li>• Educational topics and source links</li><li>• Community stories, clearly labelled as personal experiences</li></ul><div class="p-3 rounded-xl bg-[#fff6e7] text-xs text-[#815d28] mt-5">The companion is not a veterinarian. It cannot diagnose, access unprovided information or contact a clinic.</div><button class="btn btn-secondary w-full mt-4" onclick="navigate('settings')">AI preferences</button></div></div>${footer()}`)}
function askExample(q){messages.push({role:'user',text:q},{role:'bot',text:aiAnswer(q)});save();renderAIChat()}
function voiceDemo(){document.getElementById('voiceStatus').textContent='Listening simulation: microphone access is not requested. Type your question in the message box.'}
function readLast(){let m=[...messages].reverse().find(x=>x.role==='bot');if(!m){document.getElementById('voiceStatus').textContent='There is no response to read yet.';return}if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m.text));document.getElementById('voiceStatus').textContent='Reading the last response aloud.'}else document.getElementById('voiceStatus').textContent='Read-aloud is not supported in this browser.'}
function clearChat(){if(confirm('Clear the saved PawPulse conversation on this browser?')){messages=[];save();renderAIChat()}}
function evidenceView(){return shell('Evidence & Sources','Separate evidence from example data.','These organisations provide veterinary and animal-welfare information. PawPulse’s sample readings are not published research.',`<div class="space-y-3">${[['American Veterinary Medical Association (AVMA)','Pet care and veterinary guidance','General veterinary-care information can help owners prepare questions and understand the role of veterinary professionals.','https://www.avma.org/resources-tools/pet-owners'],['Cornell Feline Health Center','Cat health information','Veterinary-school resources on feline health and behaviour.','https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center'],['VCA Animal Hospitals','Pet health articles','Educational articles on common pet-care topics; use a veterinarian for individual advice.','https://vcahospitals.com/know-your-pet'],['RSPCA','Pet care advice','Animal-welfare guidance for responsible dog and cat care.','https://www.rspca.org.uk/adviceandwelfare/pets']].map(x=>card(`<div class="flex flex-wrap justify-between gap-3"><div><div class="font-bold text-[#142b45]">${x[0]}</div><div class="text-xs muted mt-1">${x[1]}</div><p class="text-sm muted mt-3">${x[2]}</p></div><a class="btn btn-secondary self-start" href="${x[3]}" target="_blank" rel="noopener noreferrer">Visit source ↗</a></div>`)).join('')}</div><div class="card p-5 mt-5"><h2 class="font-bold text-[#142b45]">How to interpret PawPulse</h2><p class="text-sm muted mt-2">Published sources provide general educational context. Community posts are personal experiences. PawPulse sample data is simulated. AI explanations are interpretations of the sample information, not clinical findings.</p></div>${footer()}`)}
function vetView(){return shell('Veterinary help','Prepare for a useful conversation with your vet.','PawPulse can organise observations, but a veterinary professional assesses your pet.',`<div class="grid md:grid-cols-2 gap-4">${card(`<h2 class="font-bold text-[#142b45]">When to seek help</h2><p class="text-sm muted mt-3 leading-relaxed">Contact a veterinary clinic when you notice a new, persistent or worrying change. Seek urgent veterinary help for severe or rapidly worsening symptoms, breathing difficulty, collapse, serious injury, suspected poisoning or other emergency concerns. If unsure, call a veterinary professional promptly.</p>`)}${card(`<h2 class="font-bold text-[#142b45]">Prepare for an appointment</h2><ul class="list-disc pl-5 text-sm muted mt-3 space-y-2"><li>When the change began and whether it is getting worse.</li><li>Changes in eating, drinking, movement, rest or behaviour.</li><li>Any possible exposure, injury or medication information.</li><li>Photos, short videos and a record of relevant observations.</li></ul>`)}</div><div class="card p-5 mt-5"><h2 class="font-bold text-[#142b45]">Create a note for your clinic</h2><p class="text-xs muted mt-1">This stays in the page and is not sent anywhere.</p><textarea id="vetNote" class="field mt-3" rows="4" placeholder="Describe what you noticed, when it started and any questions you have..."></textarea><div class="flex flex-wrap gap-2 mt-3">${btn('Copy appointment note',"copyVetNote()")}${btn('Open wellness report',"navigate('reports')",'secondary')}</div><div id="vetFeedback" class="text-xs muted mt-2" aria-live="polite"></div></div>${footer()}`)}
function copyVetNote(){let v=document.getElementById('vetNote').value;if(!v){document.getElementById('vetFeedback').textContent='Add a note first.';return}navigator.clipboard?.writeText(v).then(()=>document.getElementById('vetFeedback').textContent='Copied. No information was sent to a clinic.').catch(()=>document.getElementById('vetFeedback').textContent='Select and copy your note manually.')}
function settingsView(){return shell('Settings','Make PawPulse work the way you prefer.','Preferences are stored locally in this browser for the prototype.',`<div class="grid md:grid-cols-2 gap-4">${card(`<h2 class="font-bold text-[#142b45]">Selected pet</h2><div class="mt-3">${petSelect()}</div><p class="text-xs muted mt-2">The selected pet is used across dashboard, insights and reports.</p>`)}${card(`<h2 class="font-bold text-[#142b45]">AI preferences</h2><label class="block text-xs font-semibold mt-3">Response style<select class="field mt-1" onchange="saveSetting('style',this.value)"><option>Clear and practical</option><option>More detailed</option><option>Simple language</option></select></label><label class="block text-xs font-semibold mt-3">Response length<select class="field mt-1" onchange="saveSetting('length',this.value)"><option>Balanced</option><option>Short</option><option>Detailed</option></select></label><label class="flex items-center gap-2 text-sm mt-4"><input type="checkbox" ${settings.readAloud?'checked':''} onchange="saveSetting('readAloud',this.checked)"> Prefer read-aloud responses</label>`)}${card(`<h2 class="font-bold text-[#142b45]">Notifications</h2><label class="flex items-center gap-2 text-sm mt-4"><input type="checkbox" ${settings.alerts!==false?'checked':''} onchange="saveSetting('alerts',this.checked)"> Show demo alert indicators</label><p class="text-xs muted mt-2">No push notifications are sent.</p>`)}${card(`<h2 class="font-bold text-[#142b45]">Accessibility</h2><label class="flex items-center gap-2 text-sm mt-4"><input type="checkbox" ${settings.motion===false?'checked':''} onchange="saveSetting('motion',!this.checked)"> Reduce decorative motion</label><p class="text-xs muted mt-2">The app also respects your device’s reduced-motion setting.</p>`)}</div><div class="card p-5 mt-4"><h2 class="font-bold text-[#142b45]">Local prototype data</h2><p class="text-sm muted mt-2">Pet profiles, demo alerts, community stories, settings and AI conversation history are saved in this browser’s localStorage. They are not uploaded to a PawPulse server. Clearing browser site data removes them.</p>${btn('Reset all demo data',"resetDemo()",'secondary')}</div>${footer()}`)}
function saveSetting(k,v){settings[k]=v;save()}
function resetDemo(){if(confirm('Reset PawPulse demo profiles, stories, alerts, preferences and chat history?')){['ppPets','ppSelected','ppMode','ppAlerts','ppStories','ppMessages','ppSettings'].forEach(k=>localStorage.removeItem(k));location.hash='home';location.reload()}}
function legalView(v){let title=v==='privacy'?'Privacy Policy':v==='terms'?'Terms of Use':'Contact Us';let body=v==='privacy'?'This browser prototype stores sample profiles, stories, settings and chat history locally using localStorage. It does not send this information to a PawPulse server. Avoid entering sensitive personal information. You can reset local demo data from Settings.':v==='terms'?'PawPulse is an educational prototype. Its simulated readings, map, alerts and AI responses are not medical advice, diagnosis or a substitute for veterinary assessment. Use veterinary services for concerns about an animal.':'No real contact channel has been configured for this prototype. Add an official PawPulse contact email or support link here before public launch.';return shell('Application information',title,'Prototype information and usage details.',`${card(`<p class="text-sm muted leading-relaxed">${body}</p><div class="mt-5"><button class="btn btn-secondary" onclick="navigate('home')">Return home</button></div>`) }${footer()}`)}
// Navigation uses the URL hash, so refresh and browser history restore the current view.
window.addEventListener('hashchange',()=>{let v=location.hash.replace('#','')||'home';if(v==='tutorial')return;currentView=v;render()});
document.addEventListener('click',e=>{let b=e.target.closest('.ripple');if(!b)return;let r=document.createElement('span'),rect=b.getBoundingClientRect(),d=Math.max(rect.width,rect.height);r.className='ripple-effect';r.style.width=r.style.height=d+'px';r.style.left=(e.clientX-rect.left-d/2)+'px';r.style.top=(e.clientY-rect.top-d/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),600)});
document.getElementById('menuToggle').addEventListener('click',()=>{let n=document.getElementById('mobileNav'),open=n.classList.toggle('open');document.getElementById('menuToggle').setAttribute('aria-expanded',open)});
document.getElementById('floatingAI').addEventListener('click',()=>{document.getElementById('quickChat').classList.toggle('hidden-view');renderQuick();if(!document.getElementById('quickChat').classList.contains('hidden-view'))document.getElementById('quickInput').focus()});
document.getElementById('closeChat').addEventListener('click',()=>document.getElementById('quickChat').classList.add('hidden-view'));
document.getElementById('quickSend').addEventListener('click',()=>sendMessage('quickInput','quickMessages'));
document.getElementById('quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage('quickInput','quickMessages')});
document.getElementById('expandAI').addEventListener('click',()=>{document.getElementById('quickChat').classList.add('hidden-view');navigate('ai')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('quickChat').classList.add('hidden-view')});
const initial=location.hash.replace('#','');currentView=initial||'home';if(!['home','about','dashboard','pets','location','insights','timeline','alerts','device','reports','learn','community','ai','evidence','vet','settings','privacy','terms','contact'].includes(currentView))currentView='home';render();
</script>
</body>
</html>
